<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>🧊 FridgePhantom — 3D X-Ray Kitchen Organizer</title>
<style>
:root{
  --bg0:#070b16; --card1:rgba(24,33,60,.86); --card2:rgba(13,19,36,.92);
  --line:rgba(126,152,201,.20); --txt:#e6edf7; --dim:#93a4c4;
  --cyan:#22d3ee; --vio:#a78bfa; --amber:#fbbf24; --coral:#ff5a5f; --green:#34d399;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;padding:14px;display:flex;flex-direction:column;gap:12px;
  background:radial-gradient(1200px 800px at 72% -10%,#182448 0%,#0a1022 52%,var(--bg0) 100%);
  color:var(--txt);
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
}
.hud-card{
  background:linear-gradient(160deg,var(--card1),var(--card2));
  border:1px solid var(--line);border-radius:16px;
  box-shadow:0 12px 32px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.04);
}
h2{margin:0 0 10px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#bcd0ef}
h2 .accent{color:var(--cyan)}
h4{margin:14px 0 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9db4dd}
button{font-family:inherit}

/* ── header ─────────────────────────────── */
.hub-header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 18px}
.logo{font-size:21px;font-weight:800;letter-spacing:.03em;
  background:linear-gradient(90deg,#7dd3fc,#a78bfa 55%,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .sub{font-size:11px;font-weight:700;letter-spacing:.28em;color:var(--dim);-webkit-text-fill-color:var(--dim);margin-left:8px}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;background:rgba(10,16,32,.65);border:1px solid var(--line);
  padding:8px 13px;border-radius:12px;font-size:13px;color:#cfe0ff;white-space:nowrap}
.pill b{font-variant-numeric:tabular-nums}
#warpGrp{display:inline-flex;gap:4px;margin-left:6px}
#tempChip.alert{border-color:var(--coral);color:#ffb9bc;box-shadow:0 0 14px rgba(255,90,95,.35)}
#tempChip.safe{border-color:rgba(52,211,153,.4)}

/* ── temp banner ────────────────────────── */
.temp-banner{display:none;margin:0 auto;max-width:900px;text-align:center;
  background:rgba(255,90,95,.14);border:1px solid rgba(255,90,95,.55);color:#ffc4c7;
  border-radius:12px;padding:9px 16px;font-weight:700;font-size:13.5px;animation:pulseR 1.1s infinite}
.temp-banner.show{display:block}
@keyframes pulseR{0%,100%{box-shadow:0 0 0 rgba(255,90,95,0)}50%{box-shadow:0 0 22px rgba(255,90,95,.45)}}

/* ── buttons / chips ─────────────────────── */
.btn{background:#1c2947;border:1px solid #35476f;color:#dbe7ff;border-radius:10px;
  padding:7px 13px;cursor:pointer;font-weight:600;font-size:12.5px;transition:.15s}
.btn:hover{filter:brightness(1.25)}
.btn.primary{background:linear-gradient(135deg,#2563eb,#7c3aed);border-color:transparent}
.btn.danger{background:#471d25;border-color:#7f2e3d;color:#ffc9cf}
.btn.active{border-color:var(--cyan);color:#bff6ff;box-shadow:0 0 14px rgba(34,211,238,.30)}
.btn.off{opacity:.35;pointer-events:none}
.chipbtn{background:#16223e;border:1px solid #2d3f66;color:#d7e4ff;border-radius:10px;
  padding:8px 12px;font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s}
.chipbtn:hover{transform:translateY(-2px);border-color:var(--cyan)}
.iconbtn{background:#1c2947;border:1px solid #35476f;color:#e8f0ff;border-radius:10px;
  width:34px;height:32px;font-size:15px;cursor:pointer;flex:none}
.iconbtn:hover{filter:brightness(1.3)}

/* ── toolbar ─────────────────────────────── */
.toolbar{padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.cat-tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cat-tabs .lbl{font-size:11px;letter-spacing:.18em;color:var(--dim);margin-right:6px}
.item-chips{display:flex;gap:8px;flex-wrap:wrap}
.toolbar .note{margin:0;font-size:11.5px;color:var(--dim)}
.toolbar .note b{color:#9fd8ff}

/* ── main grid ───────────────────────────── */
.grid-main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px;align-items:stretch;min-height:0}
.stage-wrap{position:relative;height:clamp(430px,64vh,760px);overflow:hidden}
.stage-wrap.temp-alert{border-color:rgba(255,90,95,.6);box-shadow:0 0 30px rgba(255,90,95,.25)}
#gl{position:absolute;inset:0}
#gl canvas{width:100%;height:100%;display:block;touch-action:none}
.ovl{position:absolute;z-index:5}

#legend{top:12px;left:12px;display:flex;flex-direction:column;gap:5px;background:rgba(8,13,28,.62);
  border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:11.5px;color:#c6d6f2;backdrop-filter:blur(6px)}
.lg{display:flex;align-items:center;gap:7px}
.lg i{width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);flex:none}

#viewBtns{top:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:72%}
#shelfCtls{left:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:14px;max-height:88%;overflow-y:auto}
.shelf-ctl{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(8,13,28,.62);
  border:1px solid var(--line);border-radius:10px;padding:5px 4px;flex:none}
.shelf-ctl span{font-size:10px;font-weight:800;color:#8fb7ff;letter-spacing:.08em}
.shelf-ctl button{background:none;border:none;color:#bcd0ef;cursor:pointer;font-size:13px;line-height:1;padding:3px 7px;border-radius:6px}
.shelf-ctl button:hover{background:rgba(120,160,255,.15);color:#fff}

#hintbar{bottom:10px;left:50%;transform:translateX(-50%);background:rgba(8,13,28,.68);border:1px solid var(--line);
  border-radius:99px;padding:7px 16px;font-size:11.5px;color:#b9cbe8;white-space:nowrap;backdrop-filter:blur(6px);
  max-width:94%;overflow:hidden;text-overflow:ellipsis}

.insp{right:12px;bottom:12px;width:264px;background:linear-gradient(165deg,rgba(22,31,58,.95),rgba(12,17,34,.97));
  border:1px solid rgba(140,170,230,.35);border-radius:14px;padding:14px;display:none;backdrop-filter:blur(8px)}
.insp.show{display:block;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.insp h3{margin:0 44px 8px 0;font-size:15px}
.insp .close{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--dim);font-size:17px;cursor:pointer}
.chip{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.1em;padding:3px 8px;border-radius:99px;
  background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.insp .big{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05;margin:6px 0 2px}
.insp .cap{font-size:10.5px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
.insp table{width:100%;font-size:12px;border-collapse:collapse}
.insp td{padding:3.5px 0;color:#c9d8f2}
.insp td:first-child{color:var(--dim)}
.insp td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.insp-actions{display:flex;gap:8px;margin-top:12px}
.insp-actions .btn{flex:1;text-align:center;padding:8px 4px}
.insp.flash{animation:flashB .5s}
@keyframes flashB{0%,100%{border-color:rgba(140,170,230,.35)}50%{border-color:var(--cyan);box-shadow:0 0 22px rgba(34,211,238,.45)}}

.stage-wrap.xray::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:4;
  background:repeating-linear-gradient(0deg,rgba(34,211,238,.045) 0 2px,transparent 2px 5px);
  mix-blend-mode:screen}
body.dragging-food,body.dragging-food *,body.building *{cursor:crosshair!important}

/* ── build panel ─────────────────────────── */
.build-panel{left:50%;bottom:46px;transform:translateX(-50%);display:none;width:min(480px,94%);
  background:linear-gradient(165deg,rgba(20,29,56,.96),rgba(12,17,34,.97));
  border:1px solid rgba(167,139,250,.45);border-radius:14px;padding:12px 16px;backdrop-filter:blur(8px)}
.build-panel.show{display:block;animation:pop .18s ease-out}
.bp-title{font-weight:800;font-size:13px;letter-spacing:.1em;color:#d9c9ff;margin-bottom:9px}
.bp-row{display:flex;align-items:center;gap:9px;margin-bottom:8px;font-size:12px;color:#cfd9ee;flex-wrap:wrap}
.bp-row input[type=range]{flex:1;min-width:110px;accent-color:var(--vio)}
.bp-row b{font-variant-numeric:tabular-nums;min-width:42px;text-align:right}
.swatch{width:24px;height:24px;border-radius:7px;border:2px solid transparent;cursor:pointer;flex:none}
.swatch.on{border-color:#fff;box-shadow:0 0 10px currentColor}
.bp-actions{display:flex;gap:8px}
.bp-actions .btn{flex:1}
.bp-tip{margin-top:8px;font-size:10.5px;color:var(--dim);text-align:center}

/* ── inventory sidebar ───────────────────── */
.inv{padding:16px;display:flex;flex-direction:column;min-height:0}
.inv-meta{font-size:11px;color:var(--dim);margin:-4px 0 10px;font-family:Consolas,monospace}
#invList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px;min-height:0}
#invList::-webkit-scrollbar{width:8px}
#invList::-webkit-scrollbar-thumb{background:#27375c;border-radius:8px}
.inv-item{display:flex;gap:10px;align-items:center;background:rgba(12,19,38,.7);border:1px solid var(--line);
  border-left:3px solid var(--lc,#33456f);border-radius:12px;padding:9px 10px;cursor:pointer;transition:.15s}
.inv-item:hover{transform:translateX(-3px);background:rgba(20,30,56,.85)}
.lvl-ok{--lc:var(--green)} .lvl-normal{--lc:#60a5fa} .lvl-rec{--lc:var(--amber)}
.lvl-danger{--lc:var(--coral)} .lvl-spoiled{--lc:#64748b}
.iv-emoji{font-size:25px;width:34px;text-align:center;filter:drop-shadow(0 0 6px rgba(120,180,255,.25));flex:none}
.iv-mid{flex:1;min-width:0}
.iv-name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iv-sub{font-size:10px;color:var(--dim);margin:2px 0 5px;font-family:Consolas,monospace}
.iv-bar{height:5px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden}
.iv-bar i{display:block;height:100%;border-radius:4px}
.lvl-ok .iv-bar i{background:var(--green)} .lvl-normal .iv-bar i{background:#60a5fa}
.lvl-rec .iv-bar i{background:var(--amber)} .lvl-danger .iv-bar i{background:var(--coral)}
.lvl-spoiled .iv-bar i{background:#64748b}
.iv-right{text-align:right;min-width:88px;flex:none}
.iv-count{font-family:Consolas,monospace;font-weight:700;font-size:12.5px}
.lvl-ok .iv-count{color:var(--green)} .lvl-normal .iv-count{color:#60a5fa}
.lvl-rec .iv-count{color:var(--amber)} .lvl-danger .iv-count{color:var(--coral)}
.lvl-spoiled .iv-count{color:#94a3b8}
.iv-tag{font-size:9px;font-weight:800;letter-spacing:.05em;margin-top:3px}
.lvl-ok .iv-tag{color:var(--green)} .lvl-normal .iv-tag{color:#60a5fa}
.lvl-rec .iv-tag{color:var(--amber)} .lvl-danger .iv-tag{color:var(--coral)}
.lvl-spoiled .iv-tag{color:#94a3b8}
.cl-del{background:none;border:none;color:var(--dim);font-size:15px;cursor:pointer;
  padding:3px 7px;border-radius:6px;line-height:1;flex:none}
.cl-del:hover{color:#ffb4b8;background:rgba(255,90,95,.15)}
.empty-note{color:var(--dim);font-size:13px;text-align:center;padding:26px 10px;line-height:1.7}

/* ── recipe ──────────────────────────────── */
.recipe{padding:16px 18px}
.recipe-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
#scanState{font-family:Consolas,monospace;font-size:11px;color:var(--cyan);letter-spacing:.08em}
.recipe-body{position:relative;overflow:hidden}
.recipe-body.scanning::before{content:"";position:absolute;left:0;right:0;height:46px;top:0;z-index:1;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(34,211,238,.16) 45%,rgba(167,139,250,.22) 55%,transparent);
  animation:sweep .7s linear infinite}
@keyframes sweep{from{transform:translateY(-50px)}to{transform:translateY(260px)}}
.found-line{font-size:14.5px;color:#d7e4ff;margin:4px 0 12px}
.found-line b{color:#ffd479}
.found-chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
#unlockBtn{font-size:14px;padding:11px 18px}
.rec-card{margin-top:14px;border:1px dashed rgba(140,170,230,.4);border-radius:14px;padding:16px;
  background:rgba(10,16,33,.6);animation:pop .25s ease-out}
.rec-hero{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.rec-hero .em{font-size:42px;filter:drop-shadow(0 0 10px rgba(255,200,90,.35))}
.rec-hero .nm{font-size:19px;font-weight:800}
.rec-hero .meta{font-size:11.5px;color:var(--dim);margin-top:3px}
.danger-banner{background:rgba(255,90,95,.12);border:1px solid rgba(255,90,95,.45);color:#ffb3b6;
  border-radius:10px;padding:9px 13px;font-size:13px;font-weight:600;margin-bottom:12px}
.rec-steps{margin:0;padding-left:20px;font-size:13.5px;line-height:1.75;color:#d3e0f5}
.rec-foot{margin-top:10px;font-size:10.5px;color:var(--dim);font-style:italic}

/* ── bottom grid ─────────────────────────── */
.grid-bottom{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cart,.metrics{padding:16px 18px}
.cart-line{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);
  border-radius:10px;margin-bottom:7px;font-size:13.5px;background:rgba(12,19,38,.6);transition:.15s}
.cart-line:hover{border-color:#3d5488}
.cart-line input{accent-color:var(--cyan);width:15px;height:15px;cursor:pointer;flex:none}
.cart-line.done{opacity:.45}
.cart-line.done .cl-name{text-decoration:line-through}
.cl-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.cart-addrow{display:flex;gap:8px;margin-top:10px}
.cart-addrow input{flex:1;background:#0d1730;border:1px solid #33456f;color:#e6edf7;border-radius:10px;padding:9px 12px;font-size:13px;min-width:0}
.note-sm{margin:10px 2px 0;font-size:11px;color:var(--dim)}
.metric-row{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px dashed rgba(126,152,201,.15);font-size:14px}
.metric-row:last-of-type{border-bottom:none}
.metric-row .k{color:var(--dim);font-size:12.5px}
.metric-row .v{font-weight:800;font-variant-numeric:tabular-nums}
.eco-bar{height:9px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:10px}
.eco-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#34d399,#22d3ee);transition:width .5s}
.eco-why{margin-top:10px;display:flex;flex-direction:column;gap:5px;font-size:11.5px;line-height:1.55}
.eco-why .wr{display:flex;gap:7px;align-items:flex-start;color:#c9d8f2}
.eco-why .wr i{font-style:normal;flex:none}
.wr.good{color:#8ef0c3}.wr.bad{color:#ffa9ad}.wr.warn{color:#ffd479}.wr.dim{color:var(--dim)}
.wr.formula{margin-top:2px;letter-spacing:.02em}

/* ── custom areas ────────────────────────── */
#customAreas{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.area-card{padding:14px 16px;position:relative;min-height:150px}
.area-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.area-title{margin:0;font-size:14px;font-weight:800;color:#cfe4ff;cursor:pointer;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.area-title:hover{color:#fff}
.area-body{outline:none;min-height:70px;font-size:13.5px;line-height:1.65;color:#d7e2f5;cursor:text}
.area-body:empty::before{content:attr(data-ph);color:var(--dim);pointer-events:none}
.area-body:focus{background:rgba(255,255,255,.03);border-radius:8px}

/* ── modal ───────────────────────────────── */
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  background:rgba(4,8,18,.72);backdrop-filter:blur(6px)}
.modal.show{display:flex}
.sheet{width:min(440px,92vw);max-height:88vh;overflow-y:auto;background:linear-gradient(165deg,#1a2545,#101830);
  border:1px solid rgba(140,170,230,.35);border-radius:18px;padding:20px;animation:pop .2s ease-out}
.sheet h3{margin:0 0 2px;font-size:17px}
.sheet .sub{font-size:12px;color:var(--dim);margin-bottom:14px}
.m-preview{display:flex;align-items:center;gap:13px;background:rgba(9,14,30,.7);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;margin-bottom:14px}
.m-preview .em{font-size:36px}
.seg{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.seg .btn{padding:6px 11px;font-size:12px}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.presets .chipbtn{padding:6px 10px;font-size:11.5px}
.sheet input[type=datetime-local],.sheet input[type=text],.sheet input[type=number]{
  width:100%;background:#0d1730;border:1px solid #33456f;color:#e6edf7;
  border-radius:10px;padding:9px 12px;font-family:inherit;font-size:13.5px;margin-bottom:12px}
#mPrev{font-family:Consolas,monospace;font-size:12px;color:#9fd8ff;background:rgba(9,14,30,.7);
  border:1px solid rgba(34,211,238,.25);border-radius:10px;padding:10px 12px;margin-bottom:16px;line-height:1.6}
#mPrev.bad{color:#ff9ba0;border-color:rgba(255,90,95,.45)}
.m-actions{display:flex;gap:10px}
.m-actions .btn{flex:1;padding:11px}

/* ── settings panel ──────────────────────── */
.settings{position:fixed;top:66px;right:14px;width:min(560px,calc(100vw - 24px));max-height:80vh;z-index:70;
  display:none;flex-direction:column;background:linear-gradient(165deg,#182347,#0e1530);
  border:1px solid rgba(140,170,230,.4);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.6);animation:pop .18s ease-out}
.settings.show{display:flex}
.set-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.set-head h3{margin:0;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#cfe0ff;flex:1}
.set-tabs{display:flex;gap:6px;padding:10px 16px 0}
.set-sec{display:none;padding:6px 16px 16px;overflow-y:auto;min-height:0}
.set-sec.active{display:block}
#langList{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px}
.lang-row{display:flex;align-items:center;gap:9px;background:rgba(12,19,38,.65);border:1px solid var(--line);
  border-radius:10px;padding:8px 11px;font-size:13.5px}
.lang-row .dot{width:9px;height:9px;border-radius:50%;background:#33456f;flex:none}
.lang-row.on .dot{background:var(--green);box-shadow:0 0 8px var(--green)}
.lang-row .lname{cursor:pointer;font-weight:600;flex:1}
.lang-mini{background:none;border:1px solid #33456f;color:#bcd0ef;border-radius:7px;font-size:11px;padding:3px 8px;cursor:pointer}
.lang-mini:hover{border-color:var(--cyan);color:#fff}
.lang-mini.del:hover{border-color:var(--coral);color:#ffb4b8}
.lang-editor{margin-top:6px;border:1px solid var(--line);border-radius:12px;background:rgba(9,14,29,.6);
  display:flex;flex-direction:column;max-height:340px}
.lang-editor-head{display:flex;gap:8px;align-items:center;padding:9px 11px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.lang-editor-head input{flex:1;min-width:120px;margin:0!important;padding:7px 10px!important;font-size:12px!important}
#langRows{overflow-y:auto;padding:4px 11px 12px}
.krow{display:grid;grid-template-columns:148px 1fr;gap:9px;align-items:center;padding:4px 0;border-bottom:1px dashed rgba(126,152,201,.12)}
.krow .kk{font-family:Consolas,monospace;font-size:10px;color:var(--dim);word-break:break-all}
.krow input{margin:0!important;padding:6px 9px!important;font-size:12.5px!important}
.krow.grp{grid-template-columns:1fr;padding-top:10px}
.krow.grp span{font-size:10px;font-weight:800;letter-spacing:.16em;color:#7ea4d8;text-transform:uppercase}
.cli-grid{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;margin:8px 0 4px}
.cli-grid label{font-size:12px;color:var(--dim);display:block;margin-bottom:5px}
.cli-grid input{margin:0!important;max-width:180px}
.cli-now{font-family:Consolas,monospace;font-size:26px;font-weight:800;text-align:right;padding:4px 10px}
.cli-now.safe{color:var(--green)} .cli-now.alert{color:var(--coral)}
.cli-status{font-size:11px;font-weight:800;letter-spacing:.08em;text-align:right;padding:0 10px 4px}
.cli-status.safe{color:var(--green)} .cli-status.alert{color:var(--coral)}
.cli-btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* ── toasts ──────────────────────────────── */
#toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:rgba(14,22,44,.94);border:1px solid #3d5488;border-radius:12px;padding:10px 18px;font-size:13px;
  font-weight:600;color:#e2ecff;box-shadow:0 8px 26px rgba(0,0,0,.5);animation:pop .2s ease-out;max-width:82vw}
.toast.good{border-color:rgba(52,211,153,.6);color:#c6ffe9}
.toast.bad{border-color:rgba(255,90,95,.6);color:#ffd2d4}
.toast.info{border-color:rgba(34,211,238,.55)}
.toast.fadeout{opacity:0;transform:translateY(-8px);transition:.4s}

@media(max-width:1420px){.grid-main{grid-template-columns:minmax(0,1fr) 330px}}
@media(max-width:1080px){
  .grid-main{grid-template-columns:1fr}
  .stage-wrap{height:52vh}
  .grid-bottom{grid-template-columns:1fr}
  .inv{max-height:520px}
}
@media(max-width:640px){
  body{padding:8px;gap:9px}
  .hub-header{padding:10px 12px}
  .logo{font-size:17px}
  .stage-wrap{height:46vh}
  #legend{font-size:10px;padding:7px 9px}
  #hintbar{font-size:9.5px;white-space:normal;border-radius:12px;text-align:center}
  .insp{width:calc(100% - 20px)}
  .krow{grid-template-columns:110px 1fr}
}
@media(max-width:480px){
  .pill{font-size:11px;padding:6px 9px}
  .hub-header{gap:7px;padding:9px 10px}
  #warpGrp .btn{padding:5px 8px;font-size:11px}
  .chipbtn{font-size:11.5px;padding:7px 10px}
  .build-panel{bottom:38px}
}
</style>
</head>

<!-- ═══════════════ HEADER ═══════════════ -->
<header class="hud-card hub-header">
  <span class="logo">🧊 FRIDGEPHANTOM<span class="sub">CORE HUB</span></span>
  <span class="spacer"></span>
  <span class="pill"><span id="scoreDot">🟢</span>&nbsp;<span data-i18n="score"></span> <b id="scoreVal">—</b></span>
  <span class="pill">🗑️ <span data-i18n="saved"></span> <b id="savedVal">$42</b></span>
  <span class="pill" id="tempChip">🌡 <b id="tempChipV">--</b></span>
  <span class="pill">🕒 <b id="clock">--:--:--</b>
    <span id="warpGrp">
      <button class="btn warp" data-w="600">600×</button>
      <button class="btn warp" data-w="3600">3600×</button>
    </span>
  </span>
  <button class="btn" id="areaBtn" data-i18n="btn.area"></button>
  <button class="iconbtn" id="settingsBtn" title="⚙ Settings">⚙</button>
</header>

<div class="temp-banner" id="tempBanner"></div>

<!-- ═══════════════ INVENTORY DROPPER ═══════════════ -->
<section class="hud-card toolbar">
  <div class="cat-tabs" id="catTabs"></div>
  <div class="item-chips" id="itemChips"></div>
  <p class="note" data-i18n-html="drop.note"></p>
</section>

<!-- ═══════════════ MAIN GRID ═══════════════ -->
<main class="grid-main">

  <section class="hud-card stage-wrap" id="stage">
    <div id="gl"></div>

    <div class="ovl" id="legend">
      <span class="lg"><i style="--c:#34d399"></i><span data-i18n="legend.ok"></span></span>
      <span class="lg"><i style="--c:#60a5fa"></i><span data-i18n="legend.normal"></span></span>
      <span class="lg"><i style="--c:#fbbf24"></i><span data-i18n="legend.rec"></span></span>
      <span class="lg"><i style="--c:#ff5a5f"></i><span data-i18n="legend.danger"></span></span>
      <span class="lg"><i style="--c:#64748b"></i><span data-i18n="legend.spoiled"></span></span>
    </div>

    <div class="ovl" id="viewBtns">
      <button class="btn" id="xrayBtn" data-i18n="btn.xray"></button>
      <button class="btn" id="buildBtn" data-i18n="btn.build"></button>
      <button class="btn" id="addShelfBtn" data-i18n="btn.addShelf"></button>
      <button class="btn" id="delModeBtn" data-i18n="btn.delBlocks"></button>
      <button class="btn off" id="undoBtn" data-i18n="btn.undo"></button>
      <button class="btn off" id="redoBtn" data-i18n="btn.redo"></button>
      <button class="btn" id="resetBtn" data-i18n="btn.reset"></button>
    </div>

    <div class="ovl" id="shelfCtls"></div>

    <!-- build mode HUD -->
    <div class="ovl build-panel" id="buildPanel">
      <div class="bp-title">🧱 <span data-i18n="build.title"></span></div>
      <div class="bp-row">
        <span data-i18n="build.type"></span>
        <span id="bTypes" style="display:inline-flex;gap:6px;flex-wrap:wrap">
          <button class="chipbtn type active" data-bt="block">🧱</button>
          <button class="chipbtn type" data-bt="drawer" title="Drawer">📦</button>
          <button class="chipbtn type" data-bt="shelf" title="Shelf">➖</button>
        </span>
        <span style="flex:1"></span>
        <button class="btn" id="bCancelLast" data-i18n="build.cancel"></button>
      </div>
      <div class="bp-row">
        <span data-i18n="build.size"></span>
        <input type="range" id="bSize" min="0.3" max="1.6" step="0.05" value="0.6">
        <b id="bSizeV">0.60</b>
        <button class="iconbtn" id="bGrow">＋</button>
        <button class="iconbtn" id="bShrink">－</button>
      </div>
      <div class="bp-row">
        <span data-i18n="build.rotate"></span>
        <button class="iconbtn" id="bRotL">↺</button>
        <button class="iconbtn" id="bRotR">↻</button>
        <span style="flex:1"></span>
        <span data-i18n="build.color"></span>
        <span id="bSwatches" style="display:inline-flex;gap:6px"></span>
      </div>
      <div class="bp-actions">
        <button class="btn primary" id="bPlace" data-i18n="build.place"></button>
        <button class="btn danger" id="bDelSel" data-i18n="build.del"></button>
        <button class="btn" id="bExit" data-i18n="build.exit"></button>
      </div>
      <div class="bp-tip" data-i18n="build.tip"></div>
    </div>

    <div class="ovl" id="hintbar" data-i18n="hint.bar"></div>

    <div class="ovl insp" id="inspector">
      <button class="close" id="inspClose">✕</button>
      <div id="inspHead"></div>
      <div class="big" id="inspBig"></div>
      <div class="cap" id="inspCap"></div>
      <table id="inspRows"></table>
      <div class="insp-actions">
        <button class="btn primary" id="btnEat"></button>
        <button class="btn danger" id="btnToss"></button>
      </div>
    </div>
  </section>

  <aside class="hud-card inv">
    <h2><span data-i18n="inv.title"></span> <span class="accent">▮</span></h2>
    <div class="inv-meta" id="invMeta"></div>
    <div id="invList"></div>
  </aside>
</main>

<!-- ═══════════════ RECIPE GENERATOR ═══════════════ -->
<section class="hud-card recipe">
  <div class="recipe-head">
    <h2><span data-i18n="rec.title"></span></h2>
    <span id="scanState">BOOTING…</span>
  </div>
  <div class="recipe-body" id="recipeBody"></div>
</section>

<!-- ═══════════════ CUSTOM AREAS ═══════════════ -->
<div id="customAreas"></div>

<!-- ═══════════════ BOTTOM GRID ═══════════════ -->
<div class="grid-bottom">
  <section class="hud-card cart">
    <h2><span data-i18n="cart.title"></span></h2>
    <div id="cartList"></div>
    <div class="cart-addrow">
      <input type="text" id="cartInput" data-i18n-ph="cart.ph">
      <button class="btn primary" id="cartAddBtn" data-i18n="cart.add"></button>
    </div>
    <p class="note-sm" data-i18n="cart.note"></p>
  </section>
  <section class="hud-card metrics">
    <h2><span data-i18n="met.title"></span></h2>

    <div class="metric-row"><span class="k" data-i18n="met.rescued"></span><span class="v" id="rescueVal">—</span></div>

<div class="modal" id="modal">

    </div>
  </div>
</div>

<!-- ═══════════════ AREA MODAL ═══════════════ -->
<div class="modal" id="areaModal">

</div>

<div class="modal" id="foodModal">

    <div class="m-actions"><button class="btn" id="foodCancel" data-i18n="modal.cancel"></button></div>

  <div class="set-tabs">

    <h4 data-i18n="set.addTitle"></h4>

      <button class="btn primary" id="langCreateBtn" data-i18n="set.create"></button>
    </div>
    <h4><span data-i18n="set.editing"></span> <span id="langEditName" style="color:#9fd8ff"></span></h4>
    <div class="lang-editor">
      <div class="lang-editor-head">

        <button class="lang-mini del" id="langDelBtn" data-i18n="set.del"></button>
      </div>
      <div id="langRows"></div>
    </div>
    <p class="note-sm" data-i18n="set.fallback"></p>
  </div>

  <div class="set-sec" id="secClimate">
    <div class="cli-grid">
      <div>
        <label for="tempNow" data-i18n="cli.now"></label>
        <input type="number" id="tempNow" step="0.1" value="4">

      <div>
        <label data-i18n="cli.range"></label>
        <div style="display:flex;gap:6px;align-items:center">
          <input type="number" id="tempMin" step="0.5" value="0" style="width:72px">

          <input type="number" id="tempMax" step="0.5" value="8" style="width:72px">

      </div>
      <div>
        <div class="cli-now safe" id="curTempV">--</div>
        <div class="cli-status safe" id="cliStatus">SAFE</div>
      </div>
    </div>
    <p class="note-sm" data-i18n="cli.rule2"></p>
    <div class="cli-btns">
      <button class="btn" id="chillBtn" data-i18n="cli.chill"></button>
      <button class="btn" id="heatBtn" data-i18n="cli.heat"></button>
    </div>
  </div>
</div>

}

let items=[],nextId=1,selId=null,xray=false,controls=null,userCam=false;
let undoStack=[],redoStack=[];

function countFree(f,s){
  let n=0;
  for(const c of[0,1,2,3,4])for(const r of['front','back'])
    if(!occ.has(key(f,s,c,r)))n++;
  return n;
}
/* prefer the TOPMOST shelf among equally-free ones so the upper zone gets used */
function bestShelf(f){
  let best=0,bf=-1;
  for(let s=0;s<shelfY.length;s++){
    const free=countFree(f,s);
    if(free>bf||(free===bf&&shelfY[s]>shelfY[best])){bf=free;best=s;}
  }
  return best;
}
function autoShelf(){
  let bf=-1,best={f:0,s:bestShelf(0)};
  for(let f=1;f<FRIDGES.length;f++){
    const s=bestShelf(f),free=countFree(f,s);
    if(free>bf){bf=free;best={f,s};}
  }
  return best;
}
function freeSlot(f,s){
  for(const c of[2,1,3,0,4])for(const r of['front','back'])
    if(!occ.has(key(f,s,c,r)))return{c,r};
  return null;
}
function rr(c,x,y,w,h,r){
  c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();
}
function drawTag(item,st,line2){
  const cv=item.tagCv,c=cv.getContext('2d');
  c.clearRect(0,0,cv.width,cv.height);
  rr(c,3,3,378,122,24);
  c.fillStyle='rgba(8,12,26,.84)';c.fill();
  c.lineWidth=4;c.strokeStyle=COLOR[st];c.stroke();
  c.textBaseline='alphabetic';
  c.font='54px serif';c.fillText(item.def.emoji,16,86);
  c.font='700 30px "Segoe UI",sans-serif';c.fillStyle='#eaf2ff';
  let nm=iname(item.type);if(nm.length>15)nm=nm.slice(0,14)+'…';
  c.fillText(nm,88,52);
  c.font='600 25px Consolas,monospace';c.fillStyle=COLOR[st];
  c.fillText(line2,88,94);
  item.tagTex.needsUpdate=true;
}
/* shrink the floating tag so it never pokes into the shelf above */
function scaleTag(item){
  const sp=item.group.children.find(o=>o.isSprite);
  if(!sp)return;
  const shelfIndex=typeof item.shelf==='number'?item.shelf:-1;
  const topY=shelfIndex>=0&&shelfIndex+1<shelfY.length?shelfY[shelfIndex+1]:FR.ceilY;
  const avail=Math.max(.22,(topY-item.targetY)-(item.hgt||0)-.07);
  const s=Math.min(1,avail/.54);
  sp.scale.set(1.62*s,.54*s,1);
}

function spawn(type,opt={}){
  const def=CATALOG[type];
  let f=opt.f;if(f==null||!FRIDGES[f])f=autoShelf().f;
  let shelf=opt.shelf===DRAWER?DRAWER:(opt.shelf==null?bestShelf(f):Math.min(+opt.shelf,shelfY.length-1));
  let slot=opt.slot||freeSlot(f,shelf)||freeSlot(f,bestShelf(f))||{c:2,r:'front'};
  if(opt.slot&&occ.has(key(f,shelf,slot.c,slot.r)))slot=freeSlot(f,shelf)||{c:2,r:'front'};
  const expiry=opt.expiry??(simNow+def.life*H);
  const spawnT=opt.spawn??simNow;

  const g=BUILD[type]();
  g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
  const bb=new THREE.Box3().setFromObject(g);
  const hgt=bb.max.y;
  const rad=Math.max(bb.max.x-bb.min.x,bb.max.z-bb.min.z)/2+.14;

  const ring=new THREE.Mesh(new THREE.TorusGeometry(rad,.035,10,42),
    new THREE.MeshBasicMaterial({color:COLOR.ok,transparent:true,opacity:0,
      blending:THREE.AdditiveBlending,depthWrite:false,toneMapped:false}));
  ring.rotation.x=-Math.PI/2;ring.position.y=.03;ring.visible=false;
  ring.userData.isRing=true;g.add(ring);

  const cv=document.createElement('canvas');cv.width=384;cv.height=128;
  const tex=new THREE.CanvasTexture(cv);
  tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=4;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,toneMapped:false,depthTest:false}));
  sp.renderOrder=999;                 /* tag never sliced by glass shelves */
  sp.center.set(.5,0);sp.scale.set(1.62,.54,1);sp.position.y=hgt+.06;

  const item={id:nextId++,type,def,group:g,ring,tagCv:cv,tagTex:tex,tagLast:'',
    f,shelf,col:slot.c,row:slot.r,spawn:spawnT,expiry,hgt:hgt,
    spoiled:false,falling:!opt.placed,vy:0,targetY:storageY(shelf),rem:expiry-spawnT,fresh:100};

  if(xray)applyXrayToGroup(g,true);
  g.position.set(FXL[f]+COLSX[slot.c],
    opt.placed?item.targetY:item.targetY+2.8+Math.random()*1.2,
    ROWSZ[slot.r]);
  g.userData.itemId=item.id;
  g.add(sp);
  itemsRoot.add(g);items.push(item);
  occ.set(key(f,shelf,slot.c,slot.r),item.id);
  updateItemVisual(item,true);
  return item;
}

function updateItemVisual(item,force=false){
  const rem=item.expiry-simNow;
  const total=item.expiry-item.spawn;
  const fresh=total>0?Math.max(0,Math.min(100,(rem/total)*100)):0;
  item.rem=rem;item.fresh=fresh;
  const st=statusFor(rem);
  item.status=item.spoiled?'spoiled':st;
  if(item.status==='ok'){item.ring.visible=false;}
  else{
    item.ring.visible=true;
    item.ring.material.color.set(COLOR[item.status]);
    item.ring.material.opacity=item.status==='spoiled'?.35:.4;
  }
  if(!item.spoiled&&rem<=0)onSpoiled(item);
  const line2=(item.status==='spoiled')?t('tag.spoiled'):t('tag.fresh',{p:fresh.toFixed(0),t:fmtDur(Math.max(0,rem))});
  const sig=line2+'|'+item.status;
  if(sig!==item.tagLast||force){item.tagLast=sig;drawTag(item,item.status,line2);}
  scaleTag(item);
}
function onSpoiled(item){
  item.spoiled=true;
  stats.spoilageLbs+=item.def.weight;stats.tossEvents++;
  item.group.traverse(o=>{
    if(o.isMesh&&!o.userData.isRing&&!o.userData.selRing&&o.material.color){
      o.material.color.lerp(new THREE.Color('#565b66'),.62);
      o.material.roughness=Math.min(1,o.material.roughness+.35);
    }
  });
  toast(t('t.spoiledAuto',{name:iname(item.type)}),'bad');
}
function removeItem(it){
  itemsRoot.remove(it.group);
  occ.delete(key(it.f,it.shelf,it.col,it.row));
  it.tagTex.dispose();it.ring.geometry.dispose();
  items=items.filter(x=>x!==it);
  undoStack=undoStack.filter(a=>a.id!==it.id);
  redoStack=redoStack.filter(a=>a.id!==it.id);
  updateURBtns();
  if(selId===it.id)select(null);
}
function eatItem(it){
  stats.eatenValue+=it.def.price;stats.rescued++;
  toast(t('t.eaten',{name:iname(it.type),v:it.def.price.toFixed(2)}),'good');
  removeItem(it);hudTick();
}
function tossItem(it){
  if(!it.spoiled){
    stats.spoilageLbs+=it.def.weight;stats.tossEvents++;
    toast(t('t.tossedFresh',{name:iname(it.type),w:it.def.weight.toFixed(1)}),'bad');
  }else toast(t('t.tossedGone',{name:iname(it.type)}),'info');
  removeItem(it);hudTick();
}
function quickRemove(it){ /* sidebar ✕ : silent removal, no waste penalty */
  toast(t('t.removed',{name:iname(it.type)}),'info');
  removeItem(it);hudTick();
}

/* move / undo / redo */
const tweens=[];
function glide(group,to){
  tweens.push({g:group,from:group.position.clone(),to:to.clone(),t:0});
  group.userData.gliding=true;
}
function moveItemTo(it,dest,record){
  const from={f:it.f,s:it.shelf,c:it.col,r:it.row};
  if(dest.f===from.f&&dest.s===from.s&&dest.c===from.c&&dest.r===from.r)return false;
  if(occ.has(key(dest.f,dest.s,dest.c,dest.r)))return false;
  occ.delete(key(from.f,from.s,from.c,from.r));
  it.f=dest.f;it.shelf=dest.s;it.col=dest.c;it.row=dest.r;
  occ.set(key(dest.f,dest.s,dest.c,dest.r),it.id);
  it.falling=false;it.vy=0;it.targetY=storageY(dest.s);
  glide(it.group,new THREE.Vector3(FXL[dest.f]+COLSX[dest.c],storageY(dest.s),ROWSZ[dest.r]));
  if(record){
    undoStack.push({id:it.id,from,to:{...dest}});
    redoStack.length=0;updateURBtns();
    toast(t('t.moved',{name:iname(it.type),s:dest.s+1}),'info');
  }
  return true;
}
function popValid(stack){
  while(stack.length){
    const a=stack.pop();
    if(items.some(i=>i.id===a.id))return a;
  }
  return null;
}
function doUndo(){
  const a=popValid(undoStack);
  if(!a){toast(t('t.noUndo'),'info');return;}
  const it=items.find(i=>i.id===a.id);
  if(occ.has(key(a.from.f,a.from.s,a.from.c,a.from.r))){
    undoStack.push(a);toast(t('t.blocked'),'bad');updateURBtns();return;
  }
  moveItemTo(it,a.from,false);
  redoStack.push(a);updateURBtns();
}
function doRedo(){
  const a=popValid(redoStack);
  if(!a){toast(t('t.noRedo'),'info');return;}
  const it=items.find(i=>i.id===a.id);
  if(occ.has(key(a.to.f,a.to.s,a.to.c,a.to.r))){
    redoStack.push(a);toast(t('t.blocked'),'bad');updateURBtns();return;
  }
  moveItemTo(it,a.to,false);
  undoStack.push(a);updateURBtns();
}
function updateURBtns(){
  $('undoBtn').classList.toggle('off',undoStack.length===0);
  $('redoBtn').classList.toggle('off',redoStack.length===0);
}

/* pointer: pick + drag-move + build interactions */
const ray=new THREE.Raycaster(),mouseV=new THREE.Vector2();
let press=null,dragCtx=null;
function ndcFromEvent(e){
  const r=renderer.domElement.getBoundingClientRect();
  mouseV.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
}
function castItem(e){
  ndcFromEvent(e);ray.setFromCamera(mouseV,camera);
  const hits=ray.intersectObjects(itemsRoot.children,true);
  for(const h of hits){
    if(h.object.userData.selRing)continue;
    let o=h.object;
    while(o&&!o.userData.itemId)o=o.parent;
    if(o)return{id:o.userData.itemId};
  }
  return null;
}
function castBlock(e){
  ndcFromEvent(e);ray.setFromCamera(mouseV,camera);
  const hits=ray.intersectObjects(blocksRoot.children,true);
  if(!hits.length)return null;
  let o=hits[0].object;
  while(o&&o.parent!==blocksRoot&&!o.userData.delMark)o=o.parent;
  return o;
}
function slotWorldPos(f,s,c,r){
  return itemsRoot.localToWorld(new THREE.Vector3(FXL[f]+COLSX[c],storageY(s)+.03,ROWSZ[r]));
}
function bestSlotForRay(it){
  let best=null,bd=2.8;
  for(let f=0;f<FRIDGES.length;f++)
    for(let s=0;s<=shelfY.length;s++)
      for(let c=0;c<COLSX.length;c++)
        for(const r of['front','back']){
          const targetShelf=s===shelfY.length?DRAWER:s;
          if(f===it.f&&targetShelf===it.shelf&&c===it.col&&r===it.row)continue;
          if(occ.has(key(f,targetShelf,c,r)))continue;
          const p=slotWorldPos(f,targetShelf,c,r);
          if(ray.ray.direction.dot(p.clone().sub(ray.ray.origin))<=0)continue;
          const d=ray.ray.distanceToPoint(p);
          if(d<bd){bd=d;best={f,s:targetShelf,c,r};}
        }
  return best;
}

let buildMode=false,bSize=.6,bRot=0,bColor='#8b93a7',selBlock=null;
const SWATCHES=['#8b93a7','#60a5fa','#34d399','#fbbf24','#f87171','#a78bfa'];
const ghost=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),

function renderSwatches(){

    SWATCHES.forEach(c=>{

$('bSwatches')&&document.getElementById('bSwatches').addEventListener('click',e=>{
  const sw=e.target.closest('.swatch');if(!sw)return;
  bColor=sw.dataset.c;renderSwatches();
  ghost.material.color.set(bColor);
  if(selBlock)selBlock.material.color.set(bColor);
});
function surfaceHit(){
  const o=ray.ray.origin,d=ray.ray.direction;
  const ys=[FR.floorY*SCALE,(FR.floorY+.64)*SCALE,...shelfY.map(y=>y*SCALE)];
  let best=null,bt=Infinity;
  for(const Y of ys){
    if(Math.abs(d.y)<1e-6)continue;
    const tt=(Y-o.y)/d.y;
    if(tt<=0)continue;
    const p=o.clone().addScaledVector(d,tt);
    if(Math.abs(p.x)>(ow-.42)*SCALE||Math.abs(p.z)>(od-.42)*SCALE)continue;
    if(tt<bt){bt=tt;best={p,Y};}
  }
  return best;
}
function snapGhost(){
  const hit=surfaceHit();
  if(!hit){ghost.visible=false;return false;}
  const step=.25,maxX=(ow-.45)*SCALE,maxZ=(od-.45)*SCALE;
  const sx=THREE.MathUtils.clamp(Math.round(hit.p.x/step)*step,-maxX,maxX);
  const sz=THREE.MathUtils.clamp(Math.round(hit.p.z/step)*step,-maxZ,maxZ);
  ghost.visible=true;
  ghost.scale.setScalar(bSize);
  ghost.rotation.y=bRot;
  ghost.position.set(sx,hit.Y+bSize/2+.01,sz);
  return true;
}
function blockMat(o){return o&&(o.userData.mat||o.material);}
function selectBlock(m){
  if(selBlock){const pm=blockMat(selBlock);pm&&pm.emissive&&pm.emissive.setHex(0x000000);}
  selBlock=m;
  if(m){const pm=blockMat(m);pm&&pm.emissive&&pm.emissive.setHex(0x22d3ee);}
}
let blockStack=[];
function makeBlock(){
  if(bType==='drawer'){
    const g=new THREE.Group();
    const box=new THREE.Mesh(new THREE.BoxGeometry(1.5,.5,.95),
      new THREE.MeshStandardMaterial({color:bColor,roughness:.45,metalness:.08}));
    box.castShadow=box.receiveShadow=true;box.userData.hh=.25;g.add(box);
    const hnd=new THREE.Mesh(new THREE.BoxGeometry(.9,.06,.06),darkTrim);
    hnd.position.set(0,.14,.5);g.add(hnd);
    g.userData.mat=box.material;g.userData.hh=.25;
    return g;
  }
  const m=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),
    new THREE.MeshStandardMaterial({color:bColor,roughness:.45,metalness:.08}));
  m.castShadow=m.receiveShadow=true;m.userData.hh=.5;
  return m;
}
function placeBlock(pos){
  const o=makeBlock();
  o.scale.setScalar(bSize);o.rotation.y=bRot;o.position.copy(pos);
  blocksRoot.add(o);blockStack.push(o);
  toast(t('t.placed'),'good');
}
function deleteSelBlock(){
  if(!selBlock)return;
  blocksRoot.remove(selBlock);
  selBlock.traverse(n=>{n.geometry&&n.geometry.dispose();});
  blockStack=blockStack.filter(b=>b!==selBlock);
  selBlock=null;
  toast(t('t.blockDeleted'),'info');
}
function setBuild(v){

function markerSprite(target){
  const cv=document.createElement('canvas');cv.width=cv.height=96;
  const c=cv.getContext('2d');
  c.beginPath();c.arc(48,48,42,0,7);c.fillStyle='rgba(228,52,62,.95)';c.fill();
  c.strokeStyle='#fff';c.lineWidth=10;c.lineCap='round';
  c.beginPath();c.moveTo(31,31);c.lineTo(65,65);c.moveTo(65,31);c.lineTo(31,65);c.stroke();
  const tex=new THREE.CanvasTexture(cv);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false,toneMapped:false}));
  sp.renderOrder=1000;sp.scale.setScalar(.42);
  sp.userData.delMark=true;sp.userData.target=target;
  return sp;
}
function setDelMode(v){
  delMode=v;
  $('delModeBtn').classList.toggle('active',v);
  if(v&&buildMode)setBuild(false);
  blocksRoot.children.forEach(o=>{
    let sp=o.children.find(c=>c.userData.delMark);

      sp=markerSprite(o);
      sp.position.y=(o.userData.hh||.5)+.34/(o.scale.x||1);
      o.add(sp);

    if(!v&&sp)o.remove(sp);

}

renderer.domElement.addEventListener('pointerdown',e=>{

    for(const h of hits){
      let o=h.object;
      while(o&&o.parent!==blocksRoot&&!o.userData.delMark)o=o.parent;
      if(o&&o.userData.delMark){sp=o;break;}
    }
    if(sp){
      const target=sp.userData.target;
      blocksRoot.remove(target);
      target.traverse(n=>{n.geometry&&n.geometry.dispose();});
      blockStack=blockStack.filter(b=>b!==target);
      if(selBlock===target)selectBlock(null);
      toast(t('t.blockDeleted'),'info');
    }
    e.stopImmediatePropagation();e.preventDefault();
    return;
  }
  if(buildMode){
    if(e.button!==0)return;
    const blk=castBlock(e);
    if(blk){
      selectBlock(blk);
      dragCtx={block:blk,active:true};
      toast(t('t.blockSel'),'info');
    }else{
      selectBlock(null);
      dragCtx={ghostDrag:true};
      ndcFromEvent(e);ray.setFromCamera(mouseV,camera);
      snapGhost();
    }
    e.stopImmediatePropagation();
    return;
  }
  press={x:e.clientX,y:e.clientY,item:null};
  const hit=e.button===0?castItem(e):null;
  /* 📂 click empty bottom drawer face to slide it open/closed */
  if(!hit&&e.button===0){
    ndcFromEvent(e);ray.setFromCamera(mouseV,camera);
    const chits=ray.intersectObjects(FRIDGES.map(u=>u.crisper),false);
    if(chits.length){
      const u=chits[0].object.userData.unit;
      u.crisperOpen=!u.crisperOpen;
      toast(t(u.crisperOpen?'t.crisperOpen':'t.crisperClosed'),'info');
      e.stopImmediatePropagation();e.preventDefault();
      return;
    }
  }
  if(hit){
    press.item=hit.id;
    e.stopImmediatePropagation();
    const it=items.find(i=>i.id===hit.id);
    if(it&&!it.group.userData.gliding){
      dragCtx={item:it,active:false,hover:null};
      document.body.classList.add('dragging-food');
      $('hintbar').dataset.orig=$('hintbar').textContent;
      $('hintbar').textContent='🎯 ▸ ▸ ▸';
    }
  }
},{capture:false});
window.addEventListener('pointermove',e=>{
  if(buildMode){
    ndcFromEvent(e);ray.setFromCamera(mouseV,camera);
    if(dragCtx&&dragCtx.block){
      if(snapGhost())dragCtx.block.position.copy(ghost.position);
      ghost.visible=false;
    }else snapGhost();

  }
  if(!press||!dragCtx||!dragCtx.item)return;
  const dx=e.clientX-press.x,dy=e.clientY-press.y;
  if(!dragCtx.active&&dx*dx+dy*dy>30){
    dragCtx.active=true;
    renderer.domElement.style.cursor='grabbing';
  }
  if(dragCtx.active){
    ndcFromEvent(e);ray.setFromCamera(mouseV,camera);
    dragCtx.hover=bestSlotForRay(dragCtx.item);
    if(dragCtx.hover){
      slotMarker.visible=true;
      slotMarker.position.copy(slotWorldPos(dragCtx.hover.f,dragCtx.hover.s,dragCtx.hover.c,dragCtx.hover.r));
    }else slotMarker.visible=false;
  }
});
window.addEventListener('pointerup',e=>{
  const wasPress=press;press=null;
  slotMarker.visible=false;
  document.body.classList.remove('dragging-food');
  renderer.domElement.style.cursor=buildMode?'crosshair':'grab';

      if(ghost.visible)placeBlock(ghost.position.clone());
      dragCtx=null;return;
    }

  }
  if(dragCtx&&dragCtx.item){
    if(dragCtx.active){
      if(dragCtx.hover)moveItemTo(dragCtx.item,dragCtx.hover,true);
      hudTick();
    }else select(dragCtx.item.id,true);

    return;
  }
  if(wasPress&&!wasPress.item){
    const dx=e.clientX-wasPress.x,dy=e.clientY-wasPress.y;
    if(dx*dx+dy*dy<36)select(null);
  }
});

function applyXrayToGroup(g,on){
  g.traverse(o=>{
    if(!o.isMesh||o.userData.isRing||o.userData.selRing)return;
    const m=o.material;if(!m)return;
    if(on){
      if(m.userData._xr===undefined)
        m.userData._xr={op:m.opacity,tr:m.transparent,dw:m.depthWrite,
          em:m.emissive?m.emissive.getHex():0,ei:m.emissiveIntensity};
      m.transparent=true;m.opacity=.12;m.depthWrite=false;
      if(m.emissive){m.emissive.setHex(0x19d3ff);m.emissiveIntensity=.45;}
    }else if(m.userData._xr){
      const s=m.userData._xr;
      m.opacity=s.op;m.transparent=s.tr;m.depthWrite=s.dw;
      if(m.emissive){m.emissive.setHex(s.em);m.emissiveIntensity=s.ei;}
      delete m.userData._xr;
    }
  });
}
function setXray(v){

/* ── shelves ── */
function adjustShelf(i,d){
  const ny=Math.min(FR.ceilY-.55,Math.max(FR.floorY+.55,shelfY[i]+d*.3));
  for(let j=0;j<shelfY.length;j++)
    if(j!==i&&Math.abs(ny-shelfY[j])<1.02){toast(t('t.headroom'),'bad');return;}
  const dy=ny-shelfY[i];shelfY[i]=ny;
  FRIDGES.forEach(u=>u.shelfGroups[i].position.y=ny);
  items.filter(x=>x.shelf===i).forEach(x=>{
    x.targetY=ny;
    if(!x.falling)x.group.position.y=ny;else x.vy=0;
  });
  toast(t('t.adjusted',{s:i+1,delta:(dy>=0?'↑ ':'↓ ')+Math.abs(dy).toFixed(2)+' m'}),'info');
}
function buildShelfControls(){
  const host=$('shelfCtls');host.innerHTML='';
  shelfY.forEach((_,i)=>{
    const d=document.createElement('div');d.className='shelf-ctl';
    d.innerHTML=`<span>S${i+1}</span><button data-s="${i}" data-d="1">▲</button><button data-s="${i}" data-d="-1">▼</button><button data-sdel="${i}" title="🗑 delete shelf" style="color:#ff9ba0">🗑</button>`;
    host.appendChild(d);
  });
}
$('shelfCtls').addEventListener('click',e=>{
  const b=e.target.closest('button[data-s]');
  if(b){adjustShelf(+b.dataset.s,+b.dataset.d);return;}
  const db=e.target.closest('button[data-sdel]');
  if(db)deleteShelf(+db.dataset.sdel);
});
function deleteShelf(i){
  if(shelfY.length<=1){toast(t('t.shelfMin'),'bad');return;}
  const movers=items.filter(x=>x.shelf===i);
  let freeCount=0;
  for(let f=0;f<FRIDGES.length;f++)
    for(let s=0;s<shelfY.length;s++){
      if(s===i)continue;
      for(let c=0;c<COLSX.length;c++)
        for(const r of['front','back'])
          if(!occ.has(key(f,s,c,r)))freeCount++;
    }
  if(movers.length>freeCount){toast(t('t.shelfRelocateFail'),'bad');return;}
  FRIDGES.forEach(u=>{u.root.remove(u.shelfGroups[i]);u.shelfGroups.splice(i,1);});
  shelfY.splice(i,1);
  occ.clear();tweens.length=0;
  items.forEach(it=>{it.group.userData.gliding=false;});
  for(const it of items){
    if(it.shelf===i){
      outer:
      for(let f=0;f<FRIDGES.length;f++)
        for(let s=0;s<shelfY.length;s++)
          for(const c of[2,1,3,0,4])
            for(const r of['front','back'])
              if(!occ.has(key(f,s,c,r))){it.f=f;it.shelf=s;it.col=c;it.row=r;break outer;}
    }else if(it.shelf>i){it.shelf-=1;}
    occ.set(key(it.f,it.shelf,it.col,it.row),it.id);
    it.targetY=shelfY[it.shelf];
    it.falling=false;it.vy=0;it.group.rotation.z=0;
    it.group.position.set(FXL[it.f]+COLSX[it.col],it.targetY,ROWSZ[it.row]);
    updateItemVisual(it,true);
  }
  undoStack.length=0;redoStack.length=0;updateURBtns();
  buildShelfControls();
  toast(t('t.shelfDeleted',{s:i+1}),'info');
  hudTick();
}
function installShelf(){
  if(shelfY.length>=6){toast(t('t.shelfMax'),'bad');return;}
  const lo=FR.floorY+.75,hi=FR.ceilY-.5;
  const pts=[lo,...[...shelfY].sort((a,b)=>a-b),hi];
  let gap=0,at=null;
  for(let i=0;i<pts.length-1;i++){
    const gp=pts[i+1]-pts[i];
    if(gp>gap){gap=gp;at=(pts[i]+pts[i+1])/2;}
  }
  if(gap<1.15){toast(t('t.headroom'),'bad');return;}
  shelfY.push(at);
  FRIDGES.forEach(u=>u.shelfGroups.push(buildShelfGroup(at,u.root)));
  buildShelfControls();
  toast(t('t.shelfAdded'),'good');
  hudTick();
}
$('addShelfBtn').onclick=installShelf;

function toast(msg,kind='info'){
  const host=$('toasts');
  while(host.children.length>=4)host.firstChild.remove();
  const el=document.createElement('div');
  el.className=`toast ${kind}`;el.textContent=msg;
  host.appendChild(el);
  setTimeout(()=>el.classList.add('fadeout'),3400);
  setTimeout(()=>el.remove(),3900);
}

const RECIPES=[
 {id:'smoothie',emoji:'🥤',ing:['strawberry','yogurt','milk'],time:'5 min',serve:2},
 {id:'bolognese',emoji:'🍝',ing:['beef','pasta'],time:'35 min',serve:4},
 {id:'frenchtoast',emoji:'🍞',ing:['eggs','butter','milk'],time:'15 min',serve:3},
 {id:'stirfry',emoji:'🥘',ing:['chicken','carrot'],time:'20 min',serve:3},
 {id:'salmon',emoji:'🍋',ing:['salmon','butter'],time:'18 min',serve:2},
 {id:'salad',emoji:'🥗',ing:['lettuce','carrot'],time:'10 min',serve:2},
 {id:'friedrice',emoji:'🍚',ing:['curry','eggs'],time:'12 min',serve:2},
];
let lastRecipeSig='',unlockedName=null,scanTimer=null,recipeBuiltOnce=false;
function refreshRecipe(){
  const pool=items.slice()
    .sort((a,b)=>(a.status==='spoiled'?-1:a.rem)-(b.status==='spoiled'?-1:b.rem))
    .slice(0,5);
  const sig=pool.map(i=>i.type+(i.spoiled?'!':'')).sort().join(',')+'@'+lang;
  if(sig===lastRecipeSig&&recipeBuiltOnce)return;
  lastRecipeSig=sig;recipeBuiltOnce=true;
  $('scanState').textContent=t('rec.query');
  $('recipeBody').classList.add('scanning');
  clearTimeout(scanTimer);
  scanTimer=setTimeout(()=>buildRecipeHtml(pool),650);
}
function buildRecipeHtml(pool){
  $('recipeBody').classList.remove('scanning');
  $('scanState').textContent=t('rec.synced')+new Date(simNow).toLocaleTimeString(LOCALE());
  if(!pool.length){
    $('recipeBody').innerHTML=`<div class="found-line">${t('rec.empty')}</div>`;
    return;
  }
  const ids=new Set(pool.map(i=>i.type));
  let best=null,bs=0;
  for(const r of RECIPES){
    const s=r.ing.filter(x=>ids.has(x)).length;
    if(s>bs){bs=s;best=r;}
  }
  const rid=(best&&bs>0)?best.id:'fb';
  const rmeta=RECIPES.find(r=>r.id===rid)||null;
  const used=(best&&bs>0)
    ?best.ing.map(x=>pool.find(i=>i.type===x)).filter(Boolean).slice(0,4)
    :pool.slice(0,3);
  unlockedName=(unlockedName===rid)?rid:null;
  const names=used.map(i=>`<b>${iname(i.type)}</b>`).join(', ').replace(/,([^,]*)$/,' &$1');
  const meats=used.filter(i=>i.def.cat==='Meats'&&i.rem<DAY);
  const rescueVal=used.reduce((s,i)=>s+i.def.price,0);
  const rn=k=>t('rec.'+rid+'.'+k);
  $('recipeBody').innerHTML=`
    <div class="found-line">${t('rec.found',{names})}</div>
    <div class="found-chips">${used.map(i=>
      `<span class="chip" style="--c:${COLOR[i.status]}">${i.def.emoji} ${iname(i.type)} · ${i.fresh.toFixed(0)}%</span>`).join('')}
    </div>
    ${meats.length?`<div class="danger-banner">${t('rec.danger',{names:meats.map(m=>iname(m.type)).join(' & ')})}</div>`:''}
    <button class="btn primary" id="unlockBtn">${t('rec.unlock',{emoji:rmeta?rmeta.emoji:'🍲',name:rn('n')})}</button>
    <div id="recDetail"></div>`;
  const fill=()=>{
    $('recDetail').innerHTML=`
      <div class="rec-card">
        <div class="rec-hero">
          <span class="em">${rmeta?rmeta.emoji:'🍲'}</span>
          <div><div class="nm">${rn('n')}</div>
          <div class="meta">${t('rec.meta',{time:rmeta?rmeta.time:'25 min',n:rmeta?rmeta.serve:4,c:used.length,v:rescueVal.toFixed(2)})}</div></div>
        </div>
        <ol class="rec-steps">${[1,2,3,4].map(i=>`<li>${rn('s'+i)}</li>`).join('')}</ol>
        <div class="rec-foot">${t('rec.foot')}</div>
      </div>`;
  };
  if(unlockedName)fill();
  $('unlockBtn').onclick=()=>{
    unlockedName=(unlockedName===rid)?null:rid;
    if(unlockedName)fill();else $('recDetail').innerHTML='';
  };
}

/* metrics */
/* live eco-footprint: recomputed from actual fridge state on every tick */
function ecoState(){
  const n=items.length;
  const avgFresh=n?items.reduce((s,i)=>s+i.fresh,0)/n:null;
  const spoiled=items.filter(i=>i.spoiled).length;
  const liveF=n?Math.max(0,avgFresh-14*spoiled):80;   /* empty fridge = clean baseline */
  const evts=stats.rescued+stats.tossEvents;
  const histF=evts?stats.rescued/evts*100:70;         /* no decisions yet = neutral */
  return{n,avgFresh,spoiled,evts,score:Math.round(.62*liveF+.38*histF)};
}
function ecoWhyRows(e){
  const rows=[];
  if(e.n){
    rows.push({icon:'📊',tone:e.avgFresh>=60?'good':'warn',
      txt:t('eco.live',{v:Math.round(e.avgFresh),n:e.n})});
    if(e.spoiled)rows.push({icon:'☠️',tone:'bad',
      txt:t('eco.spoilIn',{n:e.spoiled,p:14*e.spoiled})});
    else rows.push({icon:'✨',tone:'good',txt:t('eco.clean')});
  }else rows.push({icon:'📭',tone:'dim',txt:t('eco.empty')});
  if(e.evts){
    const p=Math.round(stats.rescued/e.evts*100);
    rows.push({icon:'⚖️',tone:p>=75?'good':p>=45?'warn':'bad',
      txt:t('eco.hist',{r:stats.rescued,w:stats.tossEvents,p})});
  }else rows.push({icon:'🕒',tone:'dim',txt:t('eco.noHist')});
  return rows;
}
function renderMetrics(){
  $('spoilVal').textContent=stats.spoilageLbs.toFixed(1)+' '+t('met.lbs');
  $('rescueVal').textContent=stats.rescued+' '+t('met.meals');
  $('savedVal2').textContent='$'+(stats.savedBase+stats.eatenValue).toFixed(2);
  const e=ecoState();
  const tier=e.score>=75?'excellent':e.score>=45?'good':'poor';
  $('ecoVal').textContent=e.score+' '+t('eco.valSuffix')+' · '+t('met.'+tier);
  $('ecoVal').style.color=e.score>=75?'#34d399':e.score>=45?'#fbbf24':'#ff8a8e';
  $('ecoBarI').style.width=e.score+'%';
  $('ecoBarI').style.background=
    e.score>=75?'linear-gradient(90deg,#34d399,#22d3ee)':
    e.score>=45?'linear-gradient(90deg,#fbbf24,#f97316)':
                'linear-gradient(90deg,#ff5a5f,#b91c1c)';

/* ── "Add Any Food" finder: exact → add · close word → "Do you mean?" · else none ── */
const FOOD_ALIASES={
  milk:['milk','leche','milch'],
  yogurt:['yogurt','yoghurt','yogourt'],
  eggs:['egg','eggs','huevos','huevo'],
  butter:['butter','mantequilla','margarine'],
  cheese:['cheese','queso','cheddar','mozzarella'],
  juice:['juice','jugo','zumo','juicebox'],
  strawberry:['strawberry','strawberries','berry','berries','fresa','fresas','fruit'],
  apple:['apple','apples','manzana','manzanas'],
  banana:['banana','bananas','plantain','platano','platanos'],
  tomato:['tomato','tomatoes','tomate','jitomate'],
  lettuce:['lettuce','salad','greens','cabbage','lechuga'],
  carrot:['carrot','carrots','zanahoria','zanahorias'],
  beef:['beef','steak','meat','ternera','res'],
  chicken:['chicken','pollo','poultry'],
  salmon:['salmon','fish','pescado','trout'],
  bread:['bread','pan','loaf','toast'],
  pasta:['pasta','spaghetti','noodles','macaroni','fideos','noodle'],
  curry:['curry','stew','guiso','leftover','leftovers','soup'],
};
function lev(a,b){
  if(a===b)return 0;
  const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  let prev=Array.from({length:n+1},(_,j)=>j),cur=new Array(n+1);
  for(let i=1;i<=m;i++){cur[0]=i;
    for(let j=1;j<=n;j++)
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    [prev,cur]=[cur,prev];
  }
  return prev[n];
}
const normWord=w=>w.toLowerCase().trim().replace(/[^a-zà-ÿ]/g,'');
function findFood(q){
  const w=normWord(q);if(!w)return null;
  const cands=[w];const w2=w.replace(/(es|s)$/,'');if(w2&&w2!==w)cands.push(w2);
  for(const ty in FOOD_ALIASES)
    for(const a of FOOD_ALIASES[ty])
      if(cands.includes(a))return{type:ty,exact:true};
  let best=null,bd=99;
  for(const ty in FOOD_ALIASES)
    for(const a of FOOD_ALIASES[ty]){
      let d=lev(w,a);
      if(a.length>=5&&w.startsWith(a.slice(0,a.length-2)))d=Math.min(d,1);
      if(d<bd){bd=d;best={type:ty,alias:a,dist:d};}
    }
  const tol=w.length<=4?1:w.length<=7?2:3;
  return best&&best.dist<=tol?best:null;
}

/* ══════════════════════ ANIMATION LOOP ══════════════════════ */
const clk=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clk.getDelta(),.05);
  simNow+=dt*1000*warp;
  controls.update();

  /* crisper drawers slide open/closed */
  for(const u of FRIDGES){
    const tz=u.crisperOpen?1.02:0;
    u.crisper.position.z+=(tz-u.crisper.position.z)*Math.min(1,dt*7);
  }

  const tnow=performance.now();
  for(let i=tweens.length-1;i>=0;i--){
    const tw=tweens[i];
    tw.t+=dt/.32;
    const k=1-Math.pow(1-Math.min(1,tw.t),3);
    tw.g.position.lerpVectors(tw.from,tw.to,k);
    if(tw.t>=1){tw.g.userData.gliding=false;tweens.splice(i,1);}
  }
  for(const it of items){
    if(it.falling){
      it.vy-=9.8*dt;
      let y=it.group.position.y+it.vy*dt;
      if(y<=it.targetY){
        y=it.targetY;it.vy=-it.vy*.34;
        if(Math.abs(it.vy)<.35){it.falling=false;it.vy=0;it.group.rotation.z=0;}
      }
      it.group.position.y=y;
      if(it.falling)it.group.rotation.z=Math.sin(tnow/90)*.05;
    }else if(it.group.rotation.z!==0&&!it.group.userData.gliding){
      it.group.rotation.z*=.8;
      if(Math.abs(it.group.rotation.z)<.003)it.group.rotation.z=0;
    }
    if(it.ring.visible&&it.status!=='spoiled'){
      const spd=it.status==='danger'?8:it.status==='rec'?5:3.5;
      const k=(Math.sin(tnow/1000*spd)+1)/2;
      it.ring.material.opacity=.28+.5*k;
      it.ring.scale.setScalar(1+.05*k);
    }
  }
  selRing.material.opacity=.6+.3*Math.sin(tnow/280);
  renderer.render(scene,camera);
}

/* ══════════════════════ INIT — fridge & cart start EMPTY ═══*/
editLang=lang;
applyI18n();
renderAreas();
renderLangList();
renderEditor();
buildShelfControls();
hudTick();
animate();
setTimeout(()=>toast(items.length?t('t.welcome',{n:items.length,d:0}):t('t.welcomeEmpty'),'info'),900);
</script>
